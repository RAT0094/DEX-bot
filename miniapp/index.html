<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>DEX AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sidebar">
  <button id="newChat">+ چت جدید</button>
  <div id="convList"></div>
  <select id="modelSelect">
    <option value="gpt-5.6-sol">☀️ gpt-5.6-sol</option>
    <option value="claude-fable-5.1">✨ claude-fable-5.1</option>
    <option value="claude-fable-5">📖 claude-fable-5</option>
    <option value="gpt-5.5-pro">🚀 gpt-5.5-pro</option>
    <option value="gpt-5.5">⚡ gpt-5.5</option>
  </select>
</div>
<div id="main">
  <div id="chat"></div>
  <div id="inputBar">
    <input id="input" placeholder="پیام خود را بنویسید..." />
    <button id="send">ارسال</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
